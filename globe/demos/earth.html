<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Demo: Globe Texture & Phong Lighting</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050510; overflow: hidden; font-family: Arial, sans-serif; }
  #info {
    position: absolute; top: 20px; left: 20px;
    background: rgba(0,0,0,0.75); padding: 14px 18px;
    border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
    color: #fff; font-size: 12px; line-height: 2;
    max-width: 280px;
  }
  #info h2 { font-size: 13px; color: #aaa; margin-bottom: 8px; }
  #info .label { color: #888; font-size: 11px; }
  #info .value { color: #7ec8e3; font-size: 11px; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="info">
  <h2>Demo: 球体 · 贴图 · Phong光照</h2>
  <div><span class="label">几何体：</span><span class="value">SphereGeometry(1, 64, 64)</span></div>
  <div><span class="label">材质：</span><span class="value">MeshPhongMaterial</span></div>
  <div><span class="label">贴图：</span><span class="value">NASA earth_atmos_2048.jpg</span></div>
  <div><span class="label">环境光：</span><span class="value">AmbientLight(0xffffff, 0.5)</span></div>
  <div><span class="label">方向光：</span><span class="value">DirectionalLight(0xffffff, 0.8)</span></div>
  <div style="margin-top:8px; color:#666; font-size:10px;">🖱 拖拽旋转 | 滚轮缩放</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas = document.getElementById('canvas');
let W = window.innerWidth, H = window.innerHeight;

// ── 渲染器 ────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(window.devicePixelRatio);

// ── 场景 & 相机 ───────────────────────────────────────────────────
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, W/H, 0.1, 1000);
camera.position.set(0, 0, 3);

// ── 光照 ──────────────────────────────────────────────────────────
// 环境光：照亮暗面，防止完全变黑
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

// 方向光：模拟太阳，产生明暗渐变
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 3, 5);
scene.add(dirLight);

// ── 球体 + 贴图 ───────────────────────────────────────────────────
const loader = new THREE.TextureLoader();
const earthTex = loader.load(
  'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'
);

// MeshPhongMaterial 实现 Phong 光照模型
// 支持漫反射(diffuse)、镜面反射(specular)、环境光(ambient)三个分量
const globe = new THREE.Mesh(
  new THREE.SphereGeometry(1, 64, 64),
  new THREE.MeshPhongMaterial({
    map:      earthTex,                      // 漫反射贴图
    specular: new THREE.Color(0x222222),     // 镜面反射颜色（低光泽）
    shininess: 6,                            // 光泽度
  })
);
scene.add(globe);

// ── 拖拽旋转 ─────────────────────────────────────────────────────
let isDragging = false, prevX = 0, prevY = 0, rotX = 0.3, rotY = 0;

canvas.addEventListener('mousedown', e => {
  isDragging = true; prevX = e.clientX; prevY = e.clientY;
});
canvas.addEventListener('mouseup',   () => isDragging = false);
canvas.addEventListener('mousemove', e => {
  if (!isDragging) return;
  rotY += (e.clientX - prevX) * 0.005;
  rotX += (e.clientY - prevY) * 0.005;
  rotX = Math.max(-1.2, Math.min(1.2, rotX));
  prevX = e.clientX; prevY = e.clientY;
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  camera.position.z = Math.max(1.5, Math.min(8, camera.position.z + e.deltaY * 0.003));
}, { passive: false });

// ── 动画循环 ──────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  globe.rotation.x = rotX;
  globe.rotation.y = rotY;
  if (!isDragging) rotY += 0.003;
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  camera.aspect = W/H; camera.updateProjectionMatrix();
  renderer.setSize(W, H);
});
</script>
</body>
</html>
