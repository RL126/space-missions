<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Demo: Atmosphere Effect</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050510; overflow: hidden; font-family: Arial, sans-serif; }
  #info {
    position: absolute; top: 20px; left: 20px;
    background: rgba(0,0,0,0.75); padding: 14px 18px;
    border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
    color: #fff; font-size: 12px; line-height: 2;
    max-width: 300px;
  }
  #info h2 { font-size: 13px; color: #aaa; margin-bottom: 8px; }
  #info .label { color: #888; font-size: 11px; }
  #info .value { color: #7ec8e3; font-size: 11px; }
  #toggle {
    position: absolute; bottom: 30px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 12px;
  }
  .btn {
    padding: 8px 20px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08); color: #fff; font-size: 12px;
    cursor: pointer; transition: all 0.2s;
  }
  .btn.active { background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.5); }
  .btn:hover { background: rgba(255,255,255,0.15); }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="info">
  <h2>Demo: 大气层透明度效果</h2>
  <div><span class="label">实现方式：</span><span class="value">SphereGeometry(1.02, 64, 64)</span></div>
  <div><span class="label">材质：</span><span class="value">MeshPhongMaterial</span></div>
  <div><span class="label">颜色：</span><span class="value">0x3366ff（蓝色）</span></div>
  <div><span class="label">透明度：</span><span class="value">opacity: 0.05，transparent: true</span></div>
  <div><span class="label">渲染面：</span><span class="value">THREE.FrontSide</span></div>
  <div style="margin-top:8px; color:#666; font-size:10px;">点击下方按钮对比有无大气层效果</div>
  <div style="margin-top:4px; color:#666; font-size:10px;">🖱 拖拽旋转 | 滚轮缩放</div>
</div>

<div id="toggle">
  <button class="btn" id="btn-off" onclick="toggleAtmo(false)">无大气层</button>
  <button class="btn active" id="btn-on"  onclick="toggleAtmo(true)">有大气层</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas = document.getElementById('canvas');
let W = window.innerWidth, H = window.innerHeight;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(window.devicePixelRatio);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, W/H, 0.1, 1000);
camera.position.set(0, 0, 3);

// 光照
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 3, 5);
scene.add(dirLight);

// 地球球体
const loader = new THREE.TextureLoader();
const earthTex = loader.load(
  'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'
);
const globe = new THREE.Mesh(
  new THREE.SphereGeometry(1, 64, 64),
  new THREE.MeshPhongMaterial({
    map: earthTex,
    specular: new THREE.Color(0x222222),
    shininess: 6,
  })
);
scene.add(globe);

// ── 大气层：半径略大于地球，半透明蓝色球壳 ──────────────────────
// 透明混合原理：alpha blending
// 最终颜色 = src_color * src_alpha + dst_color * (1 - src_alpha)
// opacity=0.05 时大气层几乎透明，只在边缘产生淡蓝色光晕
const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(1.02, 64, 64),
  new THREE.MeshPhongMaterial({
    color:       0x3366ff,   // 蓝色
    transparent: true,       // 开启透明
    opacity:     0.05,       // 5% 不透明度
    side:        THREE.FrontSide,
  })
);
scene.add(atmosphere);

// 切换大气层
function toggleAtmo(on) {
  atmosphere.visible = on;
  document.getElementById('btn-on').classList.toggle('active', on);
  document.getElementById('btn-off').classList.toggle('active', !on);
}

// 旋转控制
let isDragging = false, prevX = 0, prevY = 0, rotX = 0.3, rotY = 0;
canvas.addEventListener('mousedown', e => { isDragging=true; prevX=e.clientX; prevY=e.clientY; });
canvas.addEventListener('mouseup',   () => isDragging=false);
canvas.addEventListener('mousemove', e => {
  if (!isDragging) return;
  rotY += (e.clientX-prevX)*0.005;
  rotX  = Math.max(-1.2, Math.min(1.2, rotX+(e.clientY-prevY)*0.005));
  prevX=e.clientX; prevY=e.clientY;
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  camera.position.z = Math.max(1.5, Math.min(8, camera.position.z+e.deltaY*0.003));
}, { passive: false });

function animate() {
  requestAnimationFrame(animate);
  globe.rotation.x = atmosphere.rotation.x = rotX;
  globe.rotation.y = atmosphere.rotation.y = rotY;
  if (!isDragging) rotY += 0.003;
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  W=window.innerWidth; H=window.innerHeight;
  camera.aspect=W/H; camera.updateProjectionMatrix();
  renderer.setSize(W,H);
});
</script>
</body>
</html>
